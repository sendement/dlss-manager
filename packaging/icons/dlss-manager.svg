<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#9333ea"/>
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#bg)"/>

  <!-- small "low-res" square -->
  <rect x="26" y="70" width="26" height="26" rx="5" fill="#ffffff" fill-opacity="0.92"/>

  <!-- diagonal scale-up arrow -->
  <path d="M56 68 L82 42" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
  <path d="M82 42 L82 60 M82 42 L64 42" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- large "hi-res" square outline -->
  <rect x="66" y="24" width="40" height="40" rx="7" fill="none" stroke="#ffffff" stroke-width="6"/>

  <!-- sparkle accents -->
  <circle cx="98" cy="86" r="4" fill="#ffffff" fill-opacity="0.9"/>
  <circle cx="108" cy="98" r="2.5" fill="#ffffff" fill-opacity="0.75"/>
</svg>
