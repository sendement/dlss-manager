[project]
name = "dlss-manager"
version = "0.3.0"
description = "Scan Steam games, manage DLSS DLL versions, and install OptiScaler / dlssg_for_sm86 -- CLI and PySide6 GUI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pefile>=2024.8.26",
    "platformdirs>=4.11.8",
    "pyside6>=6.11.2",
    "requests>=2.34.2",
]

[project.scripts]
dlss-manager = "dlss_manager:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
